<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Meta dasar -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Download video TikTok tanpa watermark dengan mudah dan cepat.">
    <meta name="keywords" content="TikTok Downloader, Download TikTok, TikTok MP4, TikTok MP3, TikTok Tanpa Watermark">
    <meta name="author" content="TikTok Downloader">
    
    <!-- Judul halaman -->
    <title>TikTok Downloader - Download Video & Audio Tanpa Watermark</title>

    <style>
        /* ============================================
           CSS VARIABEL
        ============================================ */
        :root {
            --warna-background: #0f0f1a;
            --warna-background-secondary: #1a0a2e;
            --warna-card: rgba(255, 255, 255, 0.05);
            --warna-border: rgba(255, 255, 255, 0.1);
            --warna-text: #ffffff;
            --warna-text-secondary: #b0b0c0;
            --warna-text-muted: #888888;
            --warna-pink: #ff0050;
            --warna-orange: #ff4d00;
            --warna-hijau: #00c853;
            --warna-hijau-muda: #00e676;
            --warna-cyan: #00f2ea;
            --warna-kuning: #ffcc00;
            --warna-merah: #ff4d4d;
            --radius-kartu: 24px;
            --radius-tombol: 14px;
            --transisi-cepat: 0.3s;
            --transisi-lambat: 0.5s;
        }

        /* ============================================
           RESET DASAR
        ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================
           BODY DAN BACKGROUND
        ============================================ */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, 
                var(--warna-background), 
                var(--warna-background-secondary), 
                var(--warna-background));
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            color: var(--warna-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        /* Animasi background */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ============================================
           CONTAINER UTAMA
        ============================================ */
        .container {
            width: 100%;
            max-width: 520px;
        }

        /* ============================================
           KARTU UTAMA
        ============================================ */
        .card {
            background: var(--warna-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--warna-border);
            border-radius: var(--radius-kartu);
            padding: 35px 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: var(--transisi-lambat);
        }

        .card:hover {
            border-color: rgba(255, 0, 80, 0.3);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        }

        /* ============================================
           LOGO
        ============================================ */
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--warna-pink), var(--warna-cyan));
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 30px rgba(255, 0, 80, 0.3);
            animation: pulse 2s infinite;
            cursor: pointer;
            transition: var(--transisi-cepat);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 10px 30px rgba(255, 0, 80, 0.3);
            }
            50% {
                box-shadow: 0 10px 40px rgba(0, 242, 234, 0.5);
            }
            100% {
                box-shadow: 0 10px 30px rgba(255, 0, 80, 0.3);
            }
        }

        .logo svg {
            width: 45px;
            height: 45px;
            fill: white;
        }

        /* ============================================
           JUDUL DAN SUBJUDUL
        ============================================ */
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, var(--warna-pink), var(--warna-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--warna-text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* ============================================
           INPUT GROUP
        ============================================ */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--warna-text-muted);
            pointer-events: none;
            transition: var(--transisi-cepat);
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 48px;
            border: 1px solid var(--warna-border);
            background: rgba(255, 255, 255, 0.07);
            border-radius: var(--radius-tombol);
            color: var(--warna-text);
            font-size: 14px;
            outline: none;
            transition: var(--transisi-cepat);
        }

        input::placeholder {
            color: var(--warna-text-muted);
        }

        input:focus {
            border-color: var(--warna-pink);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.2);
        }

        input:focus + svg,
        .input-group:focus-within svg {
            fill: var(--warna-pink);
        }

        /* ============================================
           TOMBOL PROSES
        ============================================ */
        .btn-proses {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--warna-pink), var(--warna-orange));
            border: none;
            color: white;
            font-weight: bold;
            border-radius: var(--radius-tombol);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transisi-cepat);
            box-shadow: 0 10px 25px rgba(255, 0, 80, 0.3);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn-proses:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 0, 80, 0.5);
        }

        .btn-proses:active {
            transform: translateY(0);
        }

        .btn-proses::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-proses:active::after {
            width: 300px;
            height: 300px;
        }

        /* ============================================
           GRUP TOMBOL DOWNLOAD
        ============================================ */
        .btn-group {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-group p {
            margin-bottom: 12px;
            color: var(--warna-text-secondary);
            font-size: 14px;
            font-weight: bold;
        }

        .btn-download {
            width: 100%;
            padding: 15px;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: var(--radius-tombol);
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: var(--transisi-cepat);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn-download svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .btn-video {
            background: linear-gradient(135deg, var(--warna-pink), var(--warna-orange));
            box-shadow: 0 8px 20px rgba(255, 0, 80, 0.3);
        }

        .btn-audio {
            background: linear-gradient(135deg, var(--warna-hijau), var(--warna-hijau-muda));
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.3);
        }

        /* ============================================
           STATUS DAN HASIL
        ============================================ */
        .loading {
            color: var(--warna-kuning);
            margin-top: 15px;
            font-size: 14px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }

        #hasil {
            margin-top: 20px;
        }

        .success {
            color: var(--warna-hijau-muda);
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .error {
            color: var(--warna-merah);
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        /* ============================================
           VIDEO PREVIEW
        ============================================ */
        video {
            width: 100%;
            border-radius: 16px;
            margin-top: 15px;
            border: 1px solid var(--warna-border);
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* ============================================
           LINK DOWNLOAD
        ============================================ */
        .link-download {
            display: inline-block;
            margin-top: 15px;
            color: var(--warna-cyan);
            text-decoration: none;
            font-weight: bold;
            background: rgba(0, 242, 234, 0.1);
            padding: 12px 25px;
            border-radius: 12px;
            transition: var(--transisi-cepat);
            border: 1px solid rgba(0, 242, 234, 0.2);
        }

        .link-download:hover {
            background: rgba(0, 242, 234, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 242, 234, 0.2);
        }

        /* ============================================
           FOOTER
        ============================================ */
        .footer {
            margin-top: 25px;
            color: var(--warna-text-muted);
            font-size: 12px;
            border-top: 1px solid var(--warna-border);
            padding-top: 15px;
        }

        /* ============================================
           RESPONSIVE DESIGN
        ============================================ */
        @media (max-width: 480px) {
            .card {
                padding: 25px 15px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
            }

            .btn-proses,
            .btn-download {
                font-size: 14px;
                padding: 13px;
            }

            .logo {
                width: 65px;
                height: 65px;
            }

            .logo svg {
                width: 35px;
                height: 35px;
            }
        }

        @media (max-width: 350px) {
            .card {
                padding: 20px 10px;
            }

            h1 {
                font-size: 20px;
            }

            input {
                font-size: 13px;
                padding: 12px 12px 12px 42px;
            }
        }
    </style>
</head>
<body>
    <!-- ============================================
         KONTEN UTAMA
    ============================================ -->
    <div class="container">
        <div class="card">
            
            <!-- Logo TikTok -->
            <div class="logo" title="TikTok Downloader">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                </svg>
            </div>

            <!-- Judul -->
            <h1>TikTok Downloader</h1>
            <p class="subtitle">Download video atau audio TikTok tanpa watermark dengan mudah dan cepat</p>

            <!-- Input link -->
            <div class="input-group">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 0 0-5 5 5 5 0 0 0 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4a5 5 0 0 0 5-5 5 5 0 0 0-5-5z"/>
                </svg>
                <input id="link" type="text" placeholder="Tempel link TikTok di sini..." autocomplete="off">
            </div>

            <!-- Tombol proses -->
            <button class="btn-proses" onclick="proses()">Proses Link</button>

            <!-- Grup tombol download -->
            <div class="btn-group" id="btnGroup">
                <p>Pilih format download:</p>
                <button class="btn-download btn-video" onclick="download('mp4')">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/>
                    </svg>
                    Download Video MP4
                </button>
                <button class="btn-download btn-audio" onclick="download('mp3')">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
                    </svg>
                    Download Audio MP3
                </button>
            </div>

            <!-- Hasil -->
            <div id="hasil"></div>

            <!-- Footer -->
            <div class="footer">
                &copy; 2026 TikTok Downloader • Dibuat dengan ❤️
            </div>

        </div>
    </div>

    <!-- ============================================
         JAVASCRIPT
    ============================================ -->
    <script>
        // Variabel global untuk menyimpan URL video dan audio
        let videoUrl = '';
        let audioUrl = '';

        /**
         * Fungsi utama untuk memproses link TikTok
         * Dipanggil saat tombol "Proses Link" diklik
         */
        async function proses() {
            // Ambil nilai dari input
            const url = document.getElementById('link').value.trim();
            const hasil = document.getElementById('hasil');
            const btnGroup = document.getElementById('btnGroup');

            // Validasi input kosong
            if (!url) {
                hasil.innerHTML = '<p class="error">Masukkan link TikTok terlebih dahulu.</p>';
                btnGroup.style.display = 'none';
                return;
            }

            // Validasi format link TikTok
            if (!url.includes('tiktok.com')) {
                hasil.innerHTML = '<p class="error">Link TikTok tidak valid.</p>';
                btnGroup.style.display = 'none';
                return;
            }

            // Tampilkan loading
            hasil.innerHTML = '<p class="loading">Memproses link...</p>';
            btnGroup.style.display = 'none';

            try {
                // Panggil API untuk ambil data
                const data = await fetchData(url);

                // Simpan URL video dan audio
                videoUrl = data.video || '';
                audioUrl = data.music || '';

                // Cek apakah data tersedia
                if (videoUrl || audioUrl) {
                    hasil.innerHTML = '<p class="success">Link berhasil diproses!</p>';
                    btnGroup.style.display = 'block';
                } else {
                    hasil.innerHTML = '<p class="error">Gagal ambil video/audio.</p>';
                }
            } catch (e) {
                hasil.innerHTML = '<p class="error">Terjadi kesalahan saat memproses.</p>';
            }
        }

        /**
         * Fungsi untuk mengambil data dari berbagai API
         * Mencoba beberapa API sampai berhasil
         */
        async function fetchData(url) {
            // Daftar API yang akan dicoba
            const apis = [
                {
                    name: 'TikWM',
                    url: 'https://www.tikwm.com/api/?url=',
                    parse: function(data) {
                        return {
                            video: data.data?.play || data.data?.hdplay || data.data?.wmplay || '',
                            music: data.data?.music || ''
                        };
                    }
                },
                {
                    name: 'TiklyDown',
                    url: 'https://api.tiklydown.eu.org/api/download?url=',
                    parse: function(data) {
                        return {
                            video: data.video?.noWatermark || data.video?.watermark || data.video?.original || '',
                            music: data.music?.playUrl || data.music?.url || ''
                        };
                    }
                }
            ];

            // Coba setiap API
            for (const api of apis) {
                try {
                    const response = await fetch(api.url + encodeURIComponent(url));
                    const data = await response.json();
                    const result = api.parse(data);

                    if (result.video || result.music) {
                        console.log('Berhasil pakai API: ' + api.name);
                        return result;
                    }
                } catch (e) {
                    console.log(api.name + ' gagal, coba berikutnya...');
                }
            }

            // Jika semua API gagal
            throw new Error('Semua API gagal');
        }

        /**
         * Fungsi untuk menampilkan hasil download
         * @param {string} type - Tipe download ('mp4' atau 'mp3')
         */
        function download(type) {
            const hasil = document.getElementById('hasil');

            if (type === 'mp4' && videoUrl) {
                hasil.innerHTML = 
                    '<p class="success">Video siap diunduh!</p>' +
                    '<video controls src="' + videoUrl + '"></video>' +
                    '<br>' +
                    '<a class="link-download" href="' + videoUrl + '" download target="_blank">Download MP4</a>';
            } else if (type === 'mp3' && audioUrl) {
                hasil.innerHTML = 
                    '<p class="success">Audio siap diunduh!</p>' +
                    '<a class="link-download" href="' + audioUrl + '" download target="_blank">Download MP3</a>';
            } else {
                hasil.innerHTML = '<p class="error">Format tidak tersedia.</p>';
            }
        }
    </script>
</body>
</html>
